[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miniagent"
version = "0.2.0"
description = "A minimal agent framework: agentic loop, tools, hooks, multi-agent handoff"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["miniagent*"]
